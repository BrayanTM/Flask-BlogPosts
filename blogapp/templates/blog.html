{% extends 'base.html' %}

{% block content %}
<!-- Página de blog -->

<article class="container blog-post">
    <h1 class="blog-post-title mb-1">{% block title %} {{ post.title }} {% endblock %}</h1>
    <p class="card-text mt-3">
        <img src="{% if get_user(post.author).avatar %}{{ get_user(post.author).avatar_url }}{% else %}{{ url_for('static', filename='img/user-light.png') }}{% endif %}"
            alt="Avatar" class="rounded-circle" width="30" height="30">
        <span class="mb-1 text-muted"><b>{{ get_user(post.author).username }}</b> - {{ post.created_at.strftime('%d
            %B %Y') }}</span>
    </p>

    <p class="mb-5 mt-5"> {{ post.info }} </p>
    <hr>

    <div class="mb-5 mt-5">
        {{ post.content | safe }}
    </div>

</article>

{% endblock %}

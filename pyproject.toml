[project]
name = "flask-blogposts"
version = "0.1.0"
description = "Una aplicación web simple para gestionar publicaciones de blog usando Flask."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cloudinary>=1.44.1",
    "flask>=3.1.2",
    "flask-ckeditor>=1.0.0",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.2",
    "psycopg2>=2.9.11",
    "python-dotenv>=1.2.1",
]
